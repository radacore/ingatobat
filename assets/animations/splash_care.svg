<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Animasi jam alarm pengingat obat dengan pil dan tanda centang">
  <title>IngatObat — alarm obat berbunyi</title>

  <!-- Halo lembut di belakang jam -->
  <circle cx="120" cy="120" r="72" fill="#FFFFFF" opacity="0.18"/>

  <!-- Gelombang bunyi alarm: dua cincin mengembang bergantian -->
  <g style="transform-box:fill-box;transform-origin:center">
    <animateTransform attributeName="transform" type="scale"
      values="0.62;1.3;1.3" keyTimes="0;0.5;1"
      dur="4s" begin="0s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="58" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0;0"
        keyTimes="0;0.12;0.5;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g style="transform-box:fill-box;transform-origin:center">
    <animateTransform attributeName="transform" type="scale"
      values="0.62;0.62;1.3;1.3" keyTimes="0;0.3;0.8;1"
      dur="4s" begin="0s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="58" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.5;0;0"
        keyTimes="0;0.3;0.42;0.8;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Badan jam: napas lembut (tanpa hilang-muncul agar loop mulus) -->
  <g style="transform-box:fill-box;transform-origin:center">
    <animateTransform attributeName="transform" type="scale"
      values="1;1;1.05;1;1" keyTimes="0;0.3;0.5;0.7;1"
      dur="4s" begin="0s" repeatCount="indefinite"/>
    <!-- kaki -->
    <line x1="96" y1="158" x2="88" y2="172" stroke="#0D47A1" stroke-width="7" stroke-linecap="round"/>
    <line x1="144" y1="158" x2="152" y2="172" stroke="#0D47A1" stroke-width="7" stroke-linecap="round"/>
    <!-- badan + muka jam -->
    <circle cx="120" cy="120" r="44" fill="#1565C0"/>
    <circle cx="120" cy="120" r="34" fill="#FFFFFF"/>
    <!-- jarum jam 10:10 -->
    <line x1="120" y1="120" x2="120" y2="98" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="136" y2="129" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="5" fill="#00897B"/>
    <!-- tombol atas -->
    <rect x="112" y="70" width="16" height="9" rx="4.5" fill="#0D47A1"/>
  </g>

  <!-- Lonceng kiri bergetar -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-12 82 66;10 82 66;-12 82 66;10 82 66;-12 82 66"
      keyTimes="0;0.25;0.5;0.75;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <circle cx="80" cy="64" r="13" fill="#0D47A1"/>
  </g>
  <!-- Lonceng kanan bergetar berlawanan fase -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="12 158 66;-10 158 66;12 158 66;-10 158 66;12 158 66"
      keyTimes="0;0.25;0.5;0.75;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <circle cx="160" cy="64" r="13" fill="#0D47A1"/>
  </g>

  <!-- Kapsul: meluncur dari kiri, lalu mengambang -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;1"
      keyTimes="0;0.18;0.8;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="-46 0;0 0;0 0;0 0" keyTimes="0;0.18;0.8;1"
      dur="4s" begin="0s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -7;0 0;0 -7;0 0" keyTimes="0;0.25;0.5;0.75;1"
        dur="4s" begin="0s" repeatCount="indefinite"/>
      <g transform="rotate(-20 53 152)">
        <rect x="24" y="139" width="58" height="26" rx="13" fill="#1565C0"/>
        <path d="M53 139h16a13 13 0 0 1 0 26H53z" fill="#00897B"/>
        <line x1="53" y1="139" x2="53" y2="165" stroke="#FFFFFF" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- Tablet bundar: meluncur dari kanan, mengambang berlawanan fase -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;1"
      keyTimes="0;0.22;0.82;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="46 0;0 0;0 0;0 0" keyTimes="0;0.22;0.82;1"
      dur="4s" begin="0s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 7;0 0;0 7;0 0" keyTimes="0;0.25;0.5;0.75;1"
        dur="4s" begin="0s" repeatCount="indefinite"/>
      <circle cx="188" cy="152" r="15" fill="#00897B"/>
      <line x1="176" y1="152" x2="200" y2="152" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Badge "sudah minum": pop-in, centang menggambar sendiri, lalu keluar -->
  <g style="transform-box:fill-box;transform-origin:center">
    <animateTransform attributeName="transform" type="scale"
      values="0;0;1.2;1;1;1;1.2;0;0"
      keyTimes="0;0.35;0.4;0.45;0.7;0.8;0.85;0.9;1"
      dur="4s" begin="0s" repeatCount="indefinite"/>
    <circle cx="172" cy="64" r="17" fill="#00897B"/>
    <path d="M164 64l6 6 11-12" stroke="#FFFFFF" stroke-width="5" fill="none"
      stroke-linecap="round" stroke-linejoin="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;0;1;1"
        keyTimes="0;0.4;0.48;0.7;0.82;0.9;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Kilau bintang berkelip -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0;1;0"
      keyTimes="0;0.15;0.3;0.55;0.7;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <path d="M44 66l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FFFFFF"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0;0"
      keyTimes="0;0.4;0.5;0.6;0.75;0.85;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <path d="M202 96l2.4 5.6 5.6 2.4-5.6 2.4-2.4 5.6-2.4-5.6-5.6-2.4 5.6-2.4z" fill="#FFFFFF"/>
  </g>
</svg>
